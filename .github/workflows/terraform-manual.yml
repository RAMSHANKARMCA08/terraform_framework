name: Manual Terraform operation

on:
  workflow_dispatch:
    inputs:
      application:
        description: Application request scope; workload state always plans all applications
        required: true
        type: choice
        options:
          - platform
          - all
          - app1
          - app2
          - app3
        default: platform
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod
        default: dev
      action:
        description: Terraform operation
        required: true
        type: choice
        options:
          - plan
          - apply
          - drift-check
        default: plan

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ inputs.environment }}-${{ inputs.application }}
  cancel-in-progress: false

jobs:
  terraform:
    name: ${{ inputs.environment }} / ${{ inputs.application }} / ${{ inputs.action }}
    runs-on: [self-hosted, linux, terraform]
    environment: ${{ inputs.environment == 'prod' && inputs.action == 'apply' && 'production' || 'non-production' }}

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_PLAN_FILE: terraform.tfplan

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.environment == 'prod' && vars.AWS_PROD_TERRAFORM_ROLE_ARN || inputs.environment == 'stage' && vars.AWS_STAGE_TERRAFORM_ROLE_ARN || vars.AWS_DEV_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - name: Load Terraform version
        id: tool_versions
        shell: bash
        run: |
          terraform_version=$(bash scripts/get-ci-tool-version.sh terraform)
          echo "terraform=$terraform_version" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tool_versions.outputs.terraform }}

      - name: Select Terraform root
        id: root
        shell: bash
        run: |
          if [[ "${{ inputs.application }}" == "platform" ]]; then
            echo "component=platform" >> "$GITHUB_OUTPUT"
            echo "directory=environments/${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
            echo "var_file=terraform.tfvars" >> "$GITHUB_OUTPUT"
          else
            echo "component=workloads" >> "$GITHUB_OUTPUT"
            echo "directory=workloads/${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
            echo "var_file=../../environments/${{ inputs.environment }}/terraform.tfvars" >> "$GITHUB_OUTPUT"
            if [[ "${{ inputs.application }}" != "all" ]]; then
              echo "::notice::Application selection is request metadata. The shared workload state plans every declared application."
            fi
          fi

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without backend
        working-directory: ${{ steps.root.outputs.directory }}
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        working-directory: ${{ steps.root.outputs.directory }}
        run: terraform validate -no-color

      - name: Initialize backend
        working-directory: ${{ steps.root.outputs.directory }}
        run: >-
          terraform init -input=false -reconfigure
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"

      - name: Create plan
        if: inputs.action == 'plan' || inputs.action == 'apply'
        working-directory: ${{ steps.root.outputs.directory }}
        shell: bash
        run: |
          extra_args=()
          if [[ "${{ steps.root.outputs.component }}" == "workloads" ]]; then
            extra_args+=("-var=platform_state_bucket=${{ vars.TF_STATE_BUCKET }}")
          fi
          terraform plan -input=false -no-color \
            -var-file="${{ steps.root.outputs.var_file }}" \
            "${extra_args[@]}" \
            -out="$TF_PLAN_FILE"
          terraform show -no-color "$TF_PLAN_FILE" > terraform-plan.txt

      - name: Upload plan report
        if: inputs.action == 'plan' || inputs.action == 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}-${{ inputs.application }}
          path: ${{ steps.root.outputs.directory }}/terraform-plan.txt
          retention-days: 30

      - name: Apply reviewed plan
        if: inputs.action == 'apply'
        working-directory: ${{ steps.root.outputs.directory }}
        run: terraform apply -input=false -auto-approve "$TF_PLAN_FILE"

      - name: Detect drift
        if: inputs.action == 'drift-check'
        id: drift
        working-directory: ${{ steps.root.outputs.directory }}
        shell: bash
        run: |
          set +e
          extra_args=()
          if [[ "${{ steps.root.outputs.component }}" == "workloads" ]]; then
            extra_args+=("-var=platform_state_bucket=${{ vars.TF_STATE_BUCKET }}")
          fi
          terraform plan -input=false -refresh-only -detailed-exitcode -no-color \
            -var-file="${{ steps.root.outputs.var_file }}" \
            "${extra_args[@]}"
          exit_code=$?
          set -e
          if [[ $exit_code -eq 2 ]]; then
            echo "detected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $exit_code

      - name: Install notification dependencies
        if: steps.drift.outputs.detected == 'true'
        run: python3 -m pip install --requirement requirements-ci.txt

      - name: Email L1 and L2 contacts
        if: steps.drift.outputs.detected == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: >-
          python3 scripts/send_drift_email.py
          --contacts applications/contacts.yml
          --environment "${{ inputs.environment }}"
          --component "${{ steps.root.outputs.component }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Fail when drift is detected
        if: steps.drift.outputs.detected == 'true'
        run: |
          echo "Terraform drift was detected and contacts were notified."
          exit 2
