name: Nightly Terraform drift detection

on:
  schedule:
    # 22:00 Asia/Kolkata (16:30 UTC).
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  drift:
    name: ${{ matrix.environment }} / ${{ matrix.component }}
    runs-on: [self-hosted, linux, terraform]
    strategy:
      fail-fast: false
      matrix:
        environment: [stage, prod]
        component: [platform, workloads]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.environment == 'prod' && vars.AWS_PROD_TERRAFORM_READ_ROLE_ARN || vars.AWS_STAGE_TERRAFORM_READ_ROLE_ARN }}
          aws-region: us-east-1

      - name: Load Terraform version
        id: tool_versions
        shell: bash
        run: |
          terraform_version=$(bash scripts/get-ci-tool-version.sh terraform)
          echo "terraform=$terraform_version" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tool_versions.outputs.terraform }}

      - name: Select root directory
        id: root
        shell: bash
        run: |
          if [[ "${{ matrix.component }}" == "platform" ]]; then
            echo "directory=environments/${{ matrix.environment }}" >> "$GITHUB_OUTPUT"
            echo "var_file=terraform.tfvars" >> "$GITHUB_OUTPUT"
          else
            echo "directory=workloads/${{ matrix.environment }}" >> "$GITHUB_OUTPUT"
            echo "var_file=../../environments/${{ matrix.environment }}/terraform.tfvars" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize Terraform
        working-directory: ${{ steps.root.outputs.directory }}
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"

      - name: Detect drift
        id: plan
        shell: bash
        working-directory: ${{ steps.root.outputs.directory }}
        run: |
          set +e
          extra_args=()
          if [[ "${{ matrix.component }}" == "workloads" ]]; then
            extra_args+=("-var=platform_state_bucket=${{ vars.TF_STATE_BUCKET }}")
          fi
          terraform plan -input=false -refresh-only -detailed-exitcode \
            -var-file="${{ steps.root.outputs.var_file }}" \
            "${extra_args[@]}" -no-color
          exit_code=$?
          set -e
          if [[ $exit_code -eq 2 ]]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $exit_code

      - name: Install notification dependencies
        if: steps.plan.outputs.drift == 'true'
        run: python3 -m pip install --requirement requirements-ci.txt

      - name: Email L1 and L2 contacts
        if: steps.plan.outputs.drift == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: >-
          python3 scripts/send_drift_email.py
          --contacts applications/contacts.yml
          --environment "${{ matrix.environment }}"
          --component "${{ matrix.component }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
