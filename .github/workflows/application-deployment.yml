name: Application Terraform Operations

on:
  workflow_dispatch:
    inputs:
      application_name:
        description: Application folder name under applications/
        required: true
        type: string
        default: instant-app
      env:
        description: Environment folder name
        required: true
        type: string
        default: prod
      run:
        description: Terraform operation
        required: true
        type: choice
        options: [plan, deploy, drift, delete]
        default: plan

permissions:
  contents: read

concurrency:
  group: terraform-${{ inputs.application_name }}-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  terraform:
    name: ${{ inputs.application_name }} / ${{ inputs.env }} / ${{ inputs.run }}
    runs-on: self-hosted
    environment: ${{ inputs.env == 'prod' && (inputs.run == 'deploy' || inputs.run == 'delete') && 'production' || 'non-production' }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_PLAN_FILE: application.tfplan
      TF_DESTROY_PLAN_FILE: application-destroy.tfplan
      PG_CONN_STR: ${{ secrets.TF_STATE_CONNECTION }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Terraform root
        id: root
        shell: bash
        run: |
          appname="${{ inputs.application_name }}"
          environment="${{ inputs.env }}"
          if [[ ! "$appname" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::Invalid application name: $appname"
            exit 1
          fi
          if [[ ! "$environment" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::Invalid environment name: $environment"
            exit 1
          fi
          directory="applications/${appname}/${environment}"
          if [[ ! -d "$directory" ]] || ! find "$directory" -maxdepth 1 -name '*.tf' -print -quit | grep -q .; then
            echo "::error::Terraform root not found: $directory"
            exit 1
          fi
          echo "directory=$directory" >> "$GITHUB_OUTPUT"

      - name: Load Terraform version
        id: versions
        shell: bash
        run: |
          terraform_version=$(bash scripts/get-ci-tool-version.sh terraform)
          echo "terraform=$terraform_version" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.versions.outputs.terraform }}

      - name: Load state backend
        id: backend
        shell: bash
        run: |
          backend=$(python3 -c "import json; print(json.load(open('config/terraform/state-management.json'))['default_backend'])")
          echo "name=$backend" >> "$GITHUB_OUTPUT"
          python3 scripts/configure_state_backend.py \
            --backend "$backend" \
            --application "${{ inputs.application_name }}" \
            --environment "${{ inputs.env }}" \
            --output "${{ steps.root.outputs.directory }}/backend.generated.tf"

      - name: Initialize Terraform
        working-directory: ${{ steps.root.outputs.directory }}
        shell: bash
        env:
          STATE_BACKEND: ${{ steps.backend.outputs.name }}
        run: |
          backend_args=()
          if [[ "$STATE_BACKEND" == "s3" ]]; then
            backend_args+=("-backend-config=bucket=${{ vars.TF_STATE_STORAGE }}")
          fi
          terraform init -input=false -reconfigure "${backend_args[@]}"

      - name: Validate Terraform
        working-directory: ${{ steps.root.outputs.directory }}
        run: terraform validate -no-color

      - name: Plan
        if: inputs.run == 'plan' || inputs.run == 'deploy'
        working-directory: ${{ steps.root.outputs.directory }}
        run: |
          terraform plan -input=false -no-color -var-file=terraform.tfvars -out="$TF_PLAN_FILE"
          terraform show -json "$TF_PLAN_FILE" > terraform-plan.json
          python3 ../../../scripts/terraform_plan_table.py terraform-plan.json --output terraform-plan-table.md
          cat terraform-plan-table.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload readable plan
        if: inputs.run == 'plan' || inputs.run == 'deploy'
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ inputs.application_name }}-${{ inputs.env }}
          path: ${{ steps.root.outputs.directory }}/terraform-plan-table.md
          retention-days: 30

      - name: Deploy with auto approval
        if: inputs.run == 'deploy'
        working-directory: ${{ steps.root.outputs.directory }}
        run: terraform apply -input=false -auto-approve "$TF_PLAN_FILE"

      - name: Check drift
        id: drift
        if: inputs.run == 'drift'
        working-directory: ${{ steps.root.outputs.directory }}
        shell: bash
        run: |
          set +e
          terraform plan -input=false -refresh-only -detailed-exitcode -no-color \
            -var-file=terraform.tfvars -out=terraform-drift.tfplan \
            > terraform-drift.txt 2>&1
          exit_code=$?
          set -e
          cat terraform-drift.txt
          if [[ $exit_code -eq 2 ]]; then
            echo "::error::Terraform drift detected"
            terraform show -json terraform-drift.tfplan > terraform-drift.json
            python3 ../../../scripts/terraform_plan_table.py \
              terraform-drift.json --output terraform-drift-report.md
          elif [[ $exit_code -eq 0 ]]; then
            printf '# Terraform drift report\n\nNo drift detected.\n' > terraform-drift-report.md
          else
            printf '# Terraform drift report\n\nDrift check failed. See `terraform-drift.txt`.\n' > terraform-drift-report.md
          fi
          cat terraform-drift-report.md >> "$GITHUB_STEP_SUMMARY"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Upload drift report
        if: always() && inputs.run == 'drift'
        uses: actions/upload-artifact@v4
        with:
          name: drift-${{ inputs.application_name }}-${{ inputs.env }}
          path: |
            ${{ steps.root.outputs.directory }}/terraform-drift-report.md
            ${{ steps.root.outputs.directory }}/terraform-drift.txt
          retention-days: 30

      - name: Fail when drift is detected
        if: inputs.run == 'drift' && steps.drift.outputs.exit_code != '0'
        run: exit ${{ steps.drift.outputs.exit_code || 1 }}

      - name: Create destroy plan and report
        if: inputs.run == 'delete'
        working-directory: ${{ steps.root.outputs.directory }}
        run: |
          terraform plan -destroy -input=false -no-color \
            -var-file=terraform.tfvars -out="$TF_DESTROY_PLAN_FILE"
          terraform show -json "$TF_DESTROY_PLAN_FILE" > terraform-destroy.json
          python3 ../../../scripts/terraform_plan_table.py \
            terraform-destroy.json --output terraform-destroy-report.md
          cat terraform-destroy-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload destroy report
        if: inputs.run == 'delete'
        uses: actions/upload-artifact@v4
        with:
          name: delete-${{ inputs.application_name }}-${{ inputs.env }}
          path: ${{ steps.root.outputs.directory }}/terraform-destroy-report.md
          retention-days: 30

      - name: Delete with auto approval
        if: inputs.run == 'delete'
        working-directory: ${{ steps.root.outputs.directory }}
        run: terraform apply -input=false -auto-approve "$TF_DESTROY_PLAN_FILE"

      - name: Verify deletion
        if: inputs.run == 'delete'
        working-directory: ${{ steps.root.outputs.directory }}
        shell: bash
        run: |
          remaining=$(terraform state list)
          if [[ -n "$remaining" ]]; then
            echo "::error::Resources remain in Terraform state:"
            echo "$remaining"
            exit 1
          fi
          echo "All Terraform-managed resources were deleted."
