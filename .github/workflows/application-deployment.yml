name: Application Deployment

on:
  workflow_dispatch:
    inputs:
      appname:
        description: Application folder name under applications/
        required: true
        type: string
        default: instant-app
      environment:
        description: Environment folder name
        required: true
        type: string
        default: prod
      action:
        description: Terraform operation
        required: true
        type: choice
        options: [PLAN, DEPLOY, CHECK_DRIFT]
        default: PLAN

permissions:
  contents: read

concurrency:
  group: deployment-${{ inputs.appname }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    name: ${{ inputs.appname }} / ${{ inputs.environment }} / ${{ inputs.action }}
    runs-on: [self-hosted, linux, terraform]
    environment: ${{ inputs.environment == 'prod' && inputs.action == 'DEPLOY' && 'production' || 'non-production' }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_PLAN_FILE: application.tfplan
      PG_CONN_STR: ${{ secrets.TF_STATE_CONNECTION }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Terraform root
        id: root
        shell: bash
        run: |
          appname="${{ inputs.appname }}"
          environment="${{ inputs.environment }}"
          if [[ ! "$appname" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::Invalid application name: $appname"
            exit 1
          fi
          if [[ ! "$environment" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::Invalid environment name: $environment"
            exit 1
          fi
          directory="applications/${appname}/${environment}"
          if [[ ! -d "$directory" ]] || ! find "$directory" -maxdepth 1 -name '*.tf' -print -quit | grep -q .; then
            echo "::error::Terraform root not found: $directory"
            exit 1
          fi
          echo "directory=$directory" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ap-south-1

      - name: Load Terraform version
        id: versions
        shell: bash
        run: |
          terraform_version=$(bash scripts/get-ci-tool-version.sh terraform)
          echo "terraform=$terraform_version" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.versions.outputs.terraform }}

      - name: Load state backend
        id: backend
        shell: bash
        run: |
          backend=$(python3 -c "import json; print(json.load(open('config/terraform/state-management.json'))['default_backend'])")
          echo "name=$backend" >> "$GITHUB_OUTPUT"
          python3 scripts/configure_state_backend.py \
            --backend "$backend" \
            --application "${{ inputs.appname }}" \
            --environment "${{ inputs.environment }}" \
            --output "${{ steps.root.outputs.directory }}/backend.generated.tf"

      - name: Ensure instant-app EC2 keys
        if: inputs.appname == 'instant-app' && (inputs.action == 'PLAN' || inputs.action == 'DEPLOY')
        shell: bash
        env:
          EC2_PUBLIC_KEY: ${{ secrets.AWS_EC2_KEYPAIR }}
        run: |
          set -euo pipefail
          missing_regions=()
          for region in ap-south-1 ap-southeast-2; do
            if ! aws ec2 describe-key-pairs --region "$region" --key-names ramkey2026 >/dev/null 2>&1; then
              missing_regions+=("$region")
            fi
          done
          if [[ ${#missing_regions[@]} -eq 0 ]]; then
            echo "ramkey2026 already exists in both regions"
            exit 0
          fi
          if [[ -z "$EC2_PUBLIC_KEY" ]]; then
            echo "::error::AWS_EC2_KEYPAIR is required; ramkey2026 is missing in: ${missing_regions[*]}"
            exit 1
          fi
          key_file="${{ runner.temp }}/ec2-key.pub"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$EC2_PUBLIC_KEY" > "$key_file"
          chmod 600 "$key_file"
          for region in "${missing_regions[@]}"; do
            aws ec2 import-key-pair --region "$region" --key-name ramkey2026 \
              --public-key-material "fileb://$key_file" >/dev/null
          done

      - name: Initialize Terraform
        working-directory: ${{ steps.root.outputs.directory }}
        shell: bash
        env:
          STATE_BACKEND: ${{ steps.backend.outputs.name }}
        run: |
          backend_args=()
          if [[ "$STATE_BACKEND" == "s3" ]]; then
            backend_args+=("-backend-config=bucket=${{ vars.TF_STATE_STORAGE }}")
          fi
          terraform init -input=false -reconfigure "${backend_args[@]}"

      - name: Validate Terraform
        working-directory: ${{ steps.root.outputs.directory }}
        run: terraform validate -no-color

      - name: Plan
        if: inputs.action == 'PLAN' || inputs.action == 'DEPLOY'
        working-directory: ${{ steps.root.outputs.directory }}
        run: |
          terraform plan -input=false -no-color -var-file=terraform.tfvars -out="$TF_PLAN_FILE"
          terraform show -json "$TF_PLAN_FILE" > terraform-plan.json
          python3 ../../../scripts/terraform_plan_table.py terraform-plan.json --output terraform-plan-table.md
          cat terraform-plan-table.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload readable plan
        if: inputs.action == 'PLAN' || inputs.action == 'DEPLOY'
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ inputs.appname }}-${{ inputs.environment }}
          path: ${{ steps.root.outputs.directory }}/terraform-plan-table.md
          retention-days: 30

      - name: Deploy with auto approval
        if: inputs.action == 'DEPLOY'
        working-directory: ${{ steps.root.outputs.directory }}
        run: terraform apply -input=false -auto-approve "$TF_PLAN_FILE"

      - name: Check drift
        if: inputs.action == 'CHECK_DRIFT'
        working-directory: ${{ steps.root.outputs.directory }}
        shell: bash
        run: |
          set +e
          terraform plan -input=false -refresh-only -detailed-exitcode -no-color \
            -var-file=terraform.tfvars
          exit_code=$?
          set -e
          if [[ $exit_code -eq 2 ]]; then
            echo "::error::Terraform drift detected"
          fi
          exit "$exit_code"
